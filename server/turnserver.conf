# coturn: the TURN relay for players whose networks can't connect directly
# (tools/install-turn.sh installs it on the server as /etc/turnserver.conf, adding
# static-auth-secret, which the matchmaker shares: it hands out short-lived
# credentials at /mm/ice, so the relay isn't open to anyone else).
listening-port=3478
tls-listening-port=5349
listening-ip=209.151.146.92
relay-ip=209.151.146.92
min-port=49160
max-port=49400
realm=ct.krazydad.com
server-name=ct.krazydad.com
fingerprint
use-auth-secret
# (static-auth-secret=... is appended by the installer; never in git)

# TLS (turns:), with ct's Let's Encrypt certificate (copied by the renewal hook)
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1

# Relay only between players on the internet: never into private or local
# networks (the server also sits on an internal 10.x network)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# A game is a few KB/s per player: keep sessions small
user-quota=12
total-quota=200
max-bps=200000
stale-nonce=600
no-cli
no-software-attribute
syslog
